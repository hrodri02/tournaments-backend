# MCP server, in its own process.
#
# This application serves exactly one thing -- the /mcp endpoint -- and reaches
# tournament data only over HTTP. There is deliberately no datasource here: no
# spring.datasource.*, no JPA, no RSA keys. Whatever it can see, the caller's
# own token could have seen through the REST API.

spring.application.name=tournaments-mcp-server

# --- MCP ---------------------------------------------------------------------
# Three properties where the Spring AI variant had five. The two that went are
# the ones that chose an implementation rather than configuring one: the
# stateless transport and the synchronous server are now the classes
# McpTransportConfig constructs, and there is no annotation scanner to switch on
# because ToolCatalog registers the tools itself.
#
# Stateless is still the decision that matters. Each JSON-RPC call is a
# self-contained POST, which is what lets the caller's Authorization header be
# the unit of identity; a session-based transport would establish identity once
# at initialize and reuse it, which is the stdio model with extra steps.
tournaments.mcp.endpoint=/mcp
tournaments.mcp.name=tournaments
tournaments.mcp.version=0.0.1

# --- the backend -------------------------------------------------------------
# Points at nginx rather than a backend instance, so MCP traffic goes through
# the same consistent-hash pool as everything else. One consequence worth
# knowing: nginx overwrites X-Forwarded-For with the connecting peer, so the
# backend's RateLimitFilter buckets every MCP call under this container's IP.
tournaments.api.base-url=${TOURNAMENTS_API_BASE_URL:http://localhost}

# A tool call blocks the MCP client until it returns. Unbounded timeouts here
# would turn a wedged backend into a wedged Claude Code session.
spring.http.client.connect-timeout=2s
spring.http.client.read-timeout=10s
