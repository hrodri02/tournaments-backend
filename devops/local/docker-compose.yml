# Local development dependencies for tournaments-backend
#
# How to use this file:
# 1) Start services:
#    docker compose -f devops/local/docker-compose.yml up -d
#
# 2) Stop services:
#    docker compose -f devops/local/docker-compose.yml down
#
# 3) View logs:
#    docker compose -f devops/local/docker-compose.yml logs -f
#
# Services included:
# - postgres : application database on localhost:5432
# - maildev  : local SMTP server on localhost:1025 and UI on localhost:1080
# - redis    : rate-limiter store (internal network only)
# - db-init  : one-shot seeder; owns the schema and mock data, then exits
# - backend-1/backend-2: two Spring Boot app instances (internal network only —
#   reach them via nginx), distinguished by INSTANCE_ID and load-balanced with
#   nginx consistent hashing
# - mcp-server: MCP server in its own process; reaches tournament data only
#   through the REST API, and is reached by MCP clients at localhost/mcp
# - nginx    : reverse proxy and the only host-facing entry point on localhost:80

# All three app services run the same image, built once and reused.
x-app-image: &app-image
  build: ../../.
  image: tournaments-backend:local

x-backend-env: &backend-env
  # This overrides the localhost setting in your application.properties
  SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
  SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
  SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
  SPRING_DATA_REDIS_HOST: redis
  # `localhost` inside a backend container is the container itself, so the
  # SMTP host has to name the maildev service on the compose network.
  SPRING_MAIL_HOST: maildev
  # The schema belongs to db-init. Serving instances must never issue DDL:
  # with two instances on one database, whichever booted last would drop and
  # recreate every table underneath the other.
  SPRING_JPA_HIBERNATE_DDL_AUTO: validate

x-backend-common: &backend-common
  <<: *app-image
  # Port intentionally NOT published to the host: clients reach the app only
  # through nginx, which overwrites X-Forwarded-For so the rate limiter can
  # trust the client IP. Exposed to other compose services on the internal network.
  expose:
    - "8080"
  depends_on:
    db-init:
      condition: service_completed_successfully  # Schema + seed data are in place
    redis:
      condition: service_healthy  # Wait until Redis is actually ready

services:
  postgres:
    image: postgres:18-alpine
    container_name: tournaments-postgres
    restart: unless-stopped
    mem_limit: 200m
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - tournaments-postgres-data:/var/lib/postgresql
    healthcheck:
      # db-init and both backends gate on this, so it must follow .env rather
      # than hardcode a user/database that a changed .env would invalidate.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  maildev:
    image: maildev/maildev:2.2.1
    container_name: tournaments-maildev
    restart: unless-stopped
    mem_limit: 100m
    ports:
      - "1025:1025"
      - "1080:1080"

  redis:
    image: redis:7-alpine
    container_name: tournaments-redis
    restart: unless-stopped
    mem_limit: 50m
    # No host port published — only the backend (internal network) talks to Redis.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Sole owner of the schema and the mock data. Runs the same image as the
  # backends with the `seed` profile and no web server, so it boots Spring,
  # creates the schema, seeds, and exits 0. Making this a separate one-shot
  # container is what removes the seeding race structurally — there is exactly
  # one seeder by construction, rather than by an instance-id check in app code.
  db-init:
    <<: *app-image
    container_name: tournaments-db-init
    mem_limit: 450m
    environment:
      <<: *backend-env
      SPRING_PROFILES_ACTIVE: seed
      # `update` creates the schema on a fresh database and is a no-op on an
      # existing one, which makes a re-run harmless. Compose restarts this
      # service whenever a backend that depends on it is restarted, so:
      #   - `create-drop` would drop the schema when this JVM exits.
      #   - `create` would drop and recreate every table underneath the OTHER
      #     backend, which is still serving traffic.
      # Paired with the count()>0 guard in AppUserConfig, a re-run does nothing.
      # Use `docker compose down -v` for a genuinely clean slate.
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
    depends_on:
      postgres:
        condition: service_healthy  # Wait until Postgres is actually ready
      redis:
        condition: service_healthy  # Wait until Redis is actually ready
    restart: "no"

  backend-1:
    <<: *backend-common
    mem_limit: 450m
    environment:
      <<: *backend-env
      INSTANCE_ID: backend-1

  backend-2:
    <<: *backend-common
    mem_limit: 450m
    environment:
      <<: *backend-env
      INSTANCE_ID: backend-2

  # MCP server for the tournaments API, in its own process.
  #
  # Note what is absent: no SPRING_DATASOURCE_*, no Redis, no mail. This service
  # has no way to reach the database and holds no credentials for it -- it calls
  # /api/v1 with the token its own caller supplied, and can therefore see
  # exactly what that caller could see. That is the whole point of running the
  # MCP server here rather than inside the backend.
  mcp-server:
    build:
      context: ../../
      dockerfile: mcp-server/Dockerfile
    image: tournaments-mcp-server:local
    container_name: tournaments-mcp-server
    restart: unless-stopped
    mem_limit: 300m
    environment:
      # Through nginx, so MCP traffic is load balanced like any other client's.
      # nginx overwrites X-Forwarded-For with the connecting peer, so every call
      # made here shares one rate-limit bucket in the backend.
      TOURNAMENTS_API_BASE_URL: http://nginx
    # Not published: nginx stays the only host-facing entry point, and routes
    # /mcp here. Deliberately does NOT depend_on nginx -- nginx depends on this
    # service, and it only calls nginx at request time.
    expose:
      - "8080"
    depends_on:
      - backend-1
      - backend-2

  nginx:
    image: nginx:1.27-alpine
    container_name: tournaments-nginx
    restart: unless-stopped
    mem_limit: 30m
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend-1
      - backend-2
      # nginx resolves a literal proxy_pass host once, at config load, and
      # refuses to start if it cannot. The /mcp route names mcp-server, so that
      # container has to exist before nginx does.
      - mcp-server

volumes:
  tournaments-postgres-data:
