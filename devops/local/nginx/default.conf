# Reverse proxy in front of the Spring Boot backend.
#
# Security note for the rate limiter: the backend identifies clients by the
# first X-Forwarded-For entry. We OVERWRITE that header here with the real
# connecting peer IP ($remote_addr) so a client cannot spoof it to scatter its
# requests across rate-limit buckets. Because we assign (not add_header /
# $proxy_add_x_forwarded_for), any client-sent X-Forwarded-For is discarded.

# Consistent-hash (ketama) pool across the two backend instances, keyed on
# the request URI. The app is stateless (JWT validated locally, refresh
# tokens in Postgres, rate limits in Redis), so which instance serves a
# request doesn't matter functionally — $request_uri is used instead of
# $remote_addr so the spread is demonstrable from a single client with curl.
upstream backend_pool {
    hash $request_uri consistent;
    server backend-1:8080;
    server backend-2:8080;
}

server {
    listen 80;
    server_name _;

    # MCP clients. A longer prefix than "/" wins in nginx regardless of order,
    # so this takes /mcp and the block below keeps everything else.
    #
    # The MCP server is a single container, not a pool: MCP calls carry no more
    # state than REST calls do, but there is nothing to spread and a second
    # instance would only add a hop. It reaches the API back through this same
    # nginx, which is why the two blocks are not merged.
    location /mcp {
        proxy_pass http://mcp-server:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streamable HTTP may answer with an event stream, which buffering would
        # hold back until the response completed. Chunked responses also need
        # HTTP/1.1 upstream, which nginx does not use by default.
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://backend_pool;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Overwrite, not append — discards any client-supplied value.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
