# Reverse proxy in front of the Spring Boot backend.
#
# Security note for the rate limiter: the backend identifies clients by the
# first X-Forwarded-For entry. We OVERWRITE that header here with the real
# connecting peer IP ($remote_addr) so a client cannot spoof it to scatter its
# requests across rate-limit buckets. Because we assign (not add_header /
# $proxy_add_x_forwarded_for), any client-sent X-Forwarded-For is discarded.

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://backend:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Overwrite, not append — discards any client-supplied value.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
