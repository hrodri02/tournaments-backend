# stdio MCP server profile.
#
# Activate with --spring.profiles.active=mcp. The MCP client launches this
# process and speaks JSON-RPC over stdin/stdout, which makes stdout part of the
# protocol rather than a place to print things. Everything below exists to keep
# it that way, or to keep a client-launched process from touching state the web
# application owns.

# --- stdout belongs to the protocol -----------------------------------------
# The default profile prints a banner, logs SQL, and logs Spring Security at
# TRACE, all to stdout. Any one of them corrupts the JSON-RPC framing. A
# console threshold of OFF silences it at the appender; logs go to a file
# instead, which is also the only way to debug a process whose stdout you
# cannot read.
spring.main.banner-mode=off
spring.main.log-startup-info=false
logging.threshold.console=OFF
logging.file.name=${MCP_LOG_FILE:target/mcp-server.log}
spring.jpa.show-sql=false
logging.level.org.hibernate.orm.jdbc.bind=off
logging.level.org.springframework.security=off
logging.level.org.hibernate.state=off

# --- no web server ----------------------------------------------------------
# The client owns this process's lifecycle; there is nothing to serve and no
# port to bind. The db-init container already runs this application with
# web-application-type=none, so the context is known to start without a servlet
# environment.
spring.main.web-application-type=none

# --- do not touch the schema ------------------------------------------------
# The default profile uses ddl-auto=create-drop against
# jdbc:postgresql://localhost:5432/tournaments -- the same database the compose
# stack serves. A client-launched process inheriting that would drop and
# recreate the schema on every start and drop it again on exit, underneath the
# running backends. This process only reads.
spring.jpa.hibernate.ddl-auto=validate

# --- rate limiting is meaningless here --------------------------------------
# RateLimitFilter guards HTTP requests and there are none. Redis is also
# unreachable from a locally launched process, since the compose service
# publishes no host port.
ratelimit.enabled=false

# --- MCP --------------------------------------------------------------------
spring.ai.mcp.server.stdio=true
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.annotation-scanner.enabled=true
spring.ai.mcp.server.name=tournaments

# --- identity ---------------------------------------------------------------
# There is no request to take a principal from, so the client that launches this
# process supplies one: claude mcp add ... -e TOURNAMENTS_USER=someone@example.com
# Startup fails when this is blank or names an unknown account. A server that
# silently answers as nobody is worse than one that refuses to start.
mcp.identity.email=${TOURNAMENTS_USER:}
